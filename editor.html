<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Study editor: IS perception study</title>
<style>
:root{color-scheme:light;--ink:#1c2328;--ink2:#52514e;--muted:#6b737a;--line:#dde2e6;--soft:#eef1f4;--bg:#f4f5f7;--card:#fff;--accent:#24597f;--accent-d:#1b4766;--sel:#e3eef7;
  --good:#0ca30c;--good-t:#006300;--crit:#d03b3b;--warn:#b07800;--warnbg:#fff6dc;--errbg:#fdeceb;--okbg:#e9f6e9;--s1:#2a78d6;--track:#cde2fb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--accent)}
header.bar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.logo{font-weight:700;font-size:15px;white-space:nowrap}
.logo span{color:var(--muted);font-weight:500}
.stitle{color:var(--muted);flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savest{font-size:12.5px;color:var(--muted);white-space:nowrap}
.savest.err{color:var(--crit)}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 50px)}
nav.side{background:#fff;border-right:1px solid var(--line);padding:12px 8px;position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto}
nav.side button{display:flex;width:100%;text-align:left;border:none;background:none;padding:8px 12px;border-radius:7px;font:inherit;color:var(--ink);cursor:pointer;gap:8px;align-items:center}
nav.side button:hover{background:var(--soft)}
nav.side button.on{background:var(--sel);color:var(--accent-d);font-weight:600}
nav.side .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
nav.side .sep{height:1px;background:var(--line);margin:8px 6px}
main#main{padding:20px 24px 60px;max-width:1240px;width:100%}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:16px 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 14px}
.card.off{background:#fafbfc}
.card.tight{padding:10px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}nav.side{position:static;height:auto;display:flex;flex-wrap:wrap}nav.side button{width:auto}.grid2,.grid3{grid-template-columns:1fr}}
label.f{display:block;margin:0 0 12px}
label.f>span.l{display:block;font-weight:600;font-size:13px;margin:0 0 4px}
label.f>span.hint,.hint{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
input[type=text],input[type=number],input[type=url],input[type=password],input[type=email],select,textarea{font:inherit;border:1px solid #bcc6ce;border-radius:6px;padding:7px 9px;width:100%;background:#fff;color:var(--ink)}
input[type=number]{width:110px}
textarea{resize:vertical;min-height:60px;line-height:1.45}
textarea.md{font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid #9fc4e3;border-color:var(--accent)}
.bad{border-color:var(--crit)!important;background:var(--errbg)!important}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline>label{display:flex;gap:6px;align-items:center}
label.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
label.chk input{flex:none;margin:3px 0 0;width:16px;height:16px;accent-color:var(--accent)}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--accent)}
.btn.sec:hover{background:var(--sel)}
.btn.small{padding:3px 9px;font-size:13px;font-weight:500}
.btn.danger{background:#fff;color:var(--crit);border-color:#e3a5a5}
.btn.danger:hover{background:var(--errbg)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.ghost:hover{background:var(--soft)}
.icons{display:inline-flex;gap:2px}
.icons button{border:1px solid transparent;background:none;border-radius:5px;padding:2px 6px;cursor:pointer;color:var(--muted);font-size:13px}
.icons button:hover{background:var(--soft);color:var(--ink);border-color:var(--line)}
.icons button.del:hover{color:var(--crit)}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--soft);padding:6px 8px;text-align:left;vertical-align:top}
table.tbl th{font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td.n,table.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
table.tbl tr:hover td{background:#fafbfc}
.scroll{overflow-x:auto}
.badge{display:inline-flex;gap:4px;align-items:center;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--good-t)}
.badge.err{background:var(--errbg);color:var(--crit)}
.badge.warn{background:var(--warnbg);color:#7a5400}
.badge.blue{background:var(--sel);color:var(--accent-d)}
.msg{border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13.5px}
.msg.err{background:var(--errbg);color:#8c1d18}
.msg.warn{background:var(--warnbg);color:#5e4300}
.msg.ok{background:var(--okbg);color:var(--good-t)}
.msg.info{background:var(--sel);color:var(--accent-d)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .tl{font-size:12.5px;color:var(--muted)}
.tile .tv{font-size:28px;font-weight:600;line-height:1.2;margin:2px 0}
.tile .td{font-size:12.5px;color:var(--ink2)}
.meter{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:6px}
.meter>div{height:100%;background:var(--s1);border-radius:0 4px 4px 0}
/* dashboard: colour carries meaning only (design phase, group, status); text stays in ink */
.dash{--dgrid:#e8ebee;--daxis:#c5ccd2;--dblue:#2a78d6;--dtrack:#e3e8ed}
.dtop{position:sticky;top:50px;z-index:6;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:10px 0;margin:-10px 0 0}
.dtop h1{margin:0}
.dctl{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.dseg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:#e4e8ec;border-radius:9px;padding:3px;gap:2px}
.dseg button{border:0;background:none;font:inherit;font-size:13.5px;padding:4px 12px;border-radius:7px;color:var(--ink2);cursor:pointer;display:inline-flex;gap:7px;align-items:baseline}
.dseg button:hover{color:var(--ink)}
.dseg button .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dseg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 0 0 1px #d3d9de}
.dseg button:focus-visible{outline:2px solid #9fc4e3;outline-offset:1px}
.dlive{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dlive i{width:8px;height:8px;border-radius:50%;background:#aab3ba}
.dlive.on i{background:var(--good)}
.dctl label.chk{font-size:13px;align-items:center}
.dctl label.chk input{margin:0}
.dpanel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 16px;min-width:0}
.dph{margin:0 0 14px}
.dph h2{font-size:16px;margin:0}
.dph p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.45;max-width:88ch}
.dgrid{display:grid;gap:16px;margin:0 0 16px}
.dgrid>.dpanel{margin:0}
.dgrid.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.dgrid.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}
.dgrid.g11{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1180px){.dgrid.g21,.dgrid.g32,.dgrid.g11{grid-template-columns:minmax(0,1fr)}}
.droute{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px 0;margin:0 0 16px}
.droute .dph{margin-bottom:10px}
.droute>.scroll{margin:0 -22px;padding:0 22px;background:#f8fafc;border-top:1px solid #eef1f4;border-bottom:1px solid var(--line)}
.route{display:grid;grid-template-rows:auto 30px auto auto;column-gap:0;min-width:660px;padding:16px 0 0}
.rtop{display:flex;flex-wrap:wrap-reverse;justify-content:center;align-content:flex-start;align-items:flex-end;gap:5px;padding:0 6px 10px;align-self:end;min-height:40px}
.rline{position:relative;display:flex;align-items:center;justify-content:center}
.rtrack,.rflow{position:absolute;left:50%;width:100%;top:50%;transform:translateY(-50%);border-radius:2px}
.rtrack{height:16px;background:#dce8f7}
.rflow{background:var(--dblue)}
.rflow.anim{animation:rgrow .7s cubic-bezier(.3,.7,.2,1) both}
@keyframes rgrow{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.rnode{position:relative;z-index:1;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #c5ccd2}
.rnode.on{border-color:var(--dblue)}
.rnode.end{width:28px;height:28px;border:0;background:#dde3e8;color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700}
.rnode.end.on{background:var(--good)}
.rlab{text-align:center;padding:8px 6px 0;line-height:1.3}
.rlab b{display:block;font-size:13.5px;font-weight:600}
.rlab span{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.rbot{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:5px;padding:10px 6px 16px}
.rbig{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.rdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--dblue);transition:transform .12s;flex:none}
.rdot.idle{background:#fab219;box-shadow:inset 0 0 0 1.5px #c98a00}
.rdot.stop{background:#fff;box-shadow:inset 0 0 0 2px #ec835a}
.rdot.hot{transform:scale(1.4)}
.rmore{font-size:11.5px;color:var(--muted);align-self:center}
.rflowkey{display:inline-flex;width:26px;height:12px;background:#dce8f7;border-radius:2px}
.rflowkey i{display:block;width:100%;height:100%;background:var(--dblue);clip-path:polygon(0 0,100% 32%,100% 68%,0 100%)}
.rcap{flex-basis:100%;text-align:center;font-size:11.5px;color:var(--ink2);margin-top:1px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin:0 -22px}
.kpi{padding:14px 16px 16px 22px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .kv{font-size:28px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .kl{font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center;margin-top:4px}
.kpi .kl i{font-style:normal;font-size:12px}
.kpi .kd{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.35}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(3n+1){border-left:0}.kpi:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-top:1px solid var(--line)}.kpi:nth-child(-n+2){border-top:0}.kpi:nth-child(odd){border-left:0}.kpi:nth-child(4){border-left:1px solid var(--line)}}
.droute>details.dnums{margin:0 -22px;padding:9px 22px 11px;border-top:1px solid var(--line)}
.dlegend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink2);margin:0 0 12px;align-items:center}
.dlegend>span{display:inline-flex;align-items:center;gap:7px}
.dlegend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.dlegend .lkey{width:18px;height:3px;border-radius:2px;display:inline-block}
.dlegend .dotkey{width:11px;height:11px;border-radius:50%;display:inline-block}
.dlegend .tickkey{width:2px;height:14px;background:var(--ink);display:inline-block}
.dlegend .cikey{width:20px;height:2px;background:#9aa5ae;border-radius:1px;display:inline-block}
.dlegend .critkey{width:0;height:14px;border-left:1.5px dashed var(--ink);display:inline-block}
details.dnums{margin-top:12px;border-top:1px solid #eef1f4;padding-top:8px}
details.dnums>summary{font-size:12.5px;font-weight:500;color:var(--accent);width:max-content}
details.dnums[open]>summary{margin-bottom:8px}
.dfit{position:relative}
.dsvg{display:block;max-width:none;overflow:visible}
.dsvg text{font-family:inherit;font-size:12px;fill:var(--ink2)}
.dsvg .ax{font-size:11.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.dsvg .lb{font-size:12.5px;fill:var(--ink)}
.dsvg .num{font-size:12.5px;fill:var(--ink);font-variant-numeric:tabular-nums}
.dsvg .el{font-size:12.5px;fill:var(--ink2)}
.dsvg .ev{font-weight:700;fill:var(--ink)}
.dsvg .ok{font-size:14px;font-weight:700;fill:#006300}
.dsvg .grid{stroke:var(--dgrid)}
.dsvg .base{stroke:var(--daxis)}
.dsvg .mid{stroke:var(--daxis);stroke-dasharray:3 3}
.dsvg .sep{stroke:#f0f2f4}
.dsvg .ln{fill:none;stroke-width:2;stroke-linejoin:round}
.dsvg .cross{stroke:#52514e;stroke-dasharray:3 3}
.dsvg .crit{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.dsvg .hit{cursor:crosshair}
.dsvg .mk.hot path{opacity:.8}
.dsvg .mk.hot circle+circle{r:7px}
.rings{display:flex;gap:12px 20px;justify-content:space-around;flex-wrap:wrap;padding:4px 0}
.ringbox{display:grid;justify-items:center;text-align:center;gap:2px;width:148px}
.ring{width:120px;height:120px;margin-bottom:6px}
.ring .rv{font-size:30px;font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums}
.ring .rs{font-size:12.5px;fill:var(--muted)}
.ringbox b{font-size:13.5px}
.ringbox span{font-size:12.5px;color:var(--muted)}
.split{display:flex;gap:2px;height:30px;margin:4px 0 14px}
.split .seg{display:grid;place-items:center;color:#fff;font-weight:650;font-size:13px;min-width:6px}
.split .seg:first-child{border-radius:6px 0 0 6px}
.split .seg:last-child{border-radius:0 6px 6px 0}
.split .seg:only-child{border-radius:6px}
.gsplit{display:grid;gap:8px}
.gsplit>div{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.gchip{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:4px;padding:1px 5px;line-height:1.35}
.plist{margin:0 -8px}
.prow{display:grid;grid-template-columns:150px 124px minmax(230px,1.25fr) minmax(220px,1fr) 118px;grid-template-areas:"who st way meth act";gap:8px 16px;align-items:center;padding:12px 8px;border-top:1px solid #eef1f4}
.prow.phead{padding:0 8px 8px;border-top:0;font-size:12px;font-weight:600;color:var(--muted)}
.prow:not(.phead):hover{background:#fafbfc}
.pwho{grid-area:who;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.pwho b{font-variant-numeric:tabular-nums;font-size:13.5px}
.ptag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.pst{grid-area:st}
.pway{grid-area:way;min-width:0}
.pmeth{grid-area:meth;display:flex;flex-wrap:wrap;gap:5px}
.pact{grid-area:act;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.s-withdrawn .pwho b,.s-ineligible .pwho b{color:var(--muted)}
.dchip{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;white-space:nowrap}
.dchip i{font-style:normal;font-size:12px;width:12px;text-align:center}
.jtrack{display:flex;gap:7px;align-items:center;flex-wrap:wrap;min-height:14px}
.jsec{display:inline-flex;gap:2px;align-items:center}
.jp{display:inline-block;width:13px;height:8px;border-radius:2px;background:var(--dtrack);flex:none}
.jp.past{background:var(--dblue)}
.jp.past.off{background:#a9b5bf}
.jp.cur{background:#0d366b;height:14px;width:15px;border-radius:3px}
.jp.cur.stop{background:#ec835a}
.jp.hot{outline:2px solid #9fc4e3;outline-offset:1px}
.pcap{display:flex;gap:2px 10px;flex-wrap:wrap;font-size:12.5px;margin-top:6px;line-height:1.35}
.pcap .pg{font-weight:500}
.mchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:1px 10px 1px 8px;background:#fff;white-space:nowrap;line-height:1.5}
.mchip i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.mchip.now{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mchip.sm{font-size:12px;padding:0 8px 0 7px}
@media (max-width:1180px){.prow{grid-template-columns:140px minmax(0,1fr) auto;grid-template-areas:"who way act" "st meth meth"}.prow.phead{display:none}}
@media (max-width:640px){.prow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who act" "st st" "way way" "meth meth"}}
.agrid{display:grid;column-gap:20px;align-items:center;min-width:470px}
.agrid .ah{font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center;padding:0 0 6px}
.agrid .ah:first-child{color:var(--muted);font-size:12px}
.agrid .aph{font-size:11.5px;color:var(--muted);padding:8px 0 2px;border-top:1px solid #eef1f4}
.agrid .an{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px 0}
.acell{display:grid;grid-template-columns:minmax(0,1fr) 24px 30px;gap:8px;align-items:center;padding:3px 4px;margin:0 -4px;border-radius:4px}
.acell.hot{background:#f4f6f8}
.atrack{display:flex;gap:2px;height:12px}
.aseg{display:block;min-width:2px}
.aseg.end{border-radius:0 4px 4px 0}
.av{font-weight:650;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.ar{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ar i,.arkey{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 2px #ec835a;display:inline-block;flex:none}
.dphrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 20px;flex-wrap:wrap}
.dseg.small button{font-size:12.5px;padding:3px 10px}
.pmore{display:flex;gap:12px;align-items:center;padding:12px 0 0;border-top:1px solid #eef1f4}
.tline{list-style:none;margin:0;padding:0}
.tline li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding:0 0 16px;position:relative}
.tline li::before{content:'';position:absolute;left:6px;top:18px;bottom:-1px;width:2px;background:#eef1f4}
.tline li:last-child{padding-bottom:0}
.tline li:last-child::before{display:none}
.tdot{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px #ec835a;margin-top:3px}
.tline li.soon .tdot{box-shadow:inset 0 0 0 3px #fab219}
.tline .th{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:baseline;font-size:13.5px}
.tline .small{color:var(--ink2);margin-top:1px}
.tm{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tline+.hint{margin-top:12px}
.dnone{color:var(--muted);font-size:13.5px;margin:0;padding:22px 16px;border:1px dashed var(--line);border-radius:8px;text-align:center}
.dsect{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 20px;flex-wrap:wrap;margin:32px 0 14px}
.dsect h2{font-size:19px;margin:0}

const CODE_GS = "/**\n * IS perception study: backend.\n * A Google Apps Script bound to a Google Sheet. It keeps the study content (a draft and every\n * published version), gives each participant three method descriptions from three different\n * design phases by minimisation (balanced per group), saves answers as they go, scores the\n * knowledge questions with keys participants never receive, and keeps email addresses apart.\n *\n * Setup: in your Google Sheet choose Extensions > Apps Script, replace the sample code with this\n * file and SAVE; then Deploy > New deployment > type: Web app, Execute as: Me, Who has access:\n * Anyone. Copy the web app URL and paste it into the editor (editor.html > Connect).\n * After changing this script: Deploy > Manage deployments > pencil > Version: New version > Deploy.\n * Generated by the study editor on __GENERATED__.\n */\nvar ADMIN_KEY = '__ADMIN_KEY__';   // private: lets the editor read and change the study\nvar CHUNK = 40000;                 // characters per cell when storing JSON (a cell holds 50,000)\nvar APP = 'IS perception study';\n\nvar HEADERS = {\n  Content: ['version', 'status', 'saved', 'note', 'json_parts', 'json'],\n  Participants: ['pid', 'token', 'group', 'mode', 'version', 'status', 'step', 'started', 'updated', 'submitted', 'minutes', 'seq', 'methods', 'src', 'json_parts', 'json'],\n  Contacts: ['pid', 'email', 'added'],\n  Log: ['time', 'action', 'detail']\n};\nvar P_PID = 0, P_TOKEN = 1, P_GROUP = 2, P_MODE = 3, P_VER = 4, P_STATUS = 5, P_STEP = 6, P_STARTED = 7, P_UPDATED = 8,\n  P_SUBMITTED = 9, P_MIN = 10, P_SEQ = 11, P_METHODS = 12, P_SRC = 13, P_JSON = 14;\n\nfunction setup() {\n  Object.keys(HEADERS).forEach(function (n) { sheet_(n); });\n  Logger.log('Ready: ' + SpreadsheetApp.getActiveSpreadsheet().getUrl());\n}\n\nfunction doGet(e) {\n  var p = (e && e.parameter) || {};\n  if (p.action === 'content') return json_(safe_(function () { return content_(p); }));\n  return json_({ ok: true, app: APP, backend: 1 });\n}\n\nfunction doPost(e) {\n  var req;\n  try { req = JSON.parse(e.postData.contents); } catch (err) { return json_({ ok: false, error: 'Bad request' }); }\n  return json_(safe_(function () { return route_(req); }));\n}\n\nfunction safe_(fn) {\n  try { var r = fn() || {}; r.ok = true; return r; }\n  catch (err) {\n    var m = String((err && err.message) || err), out = { ok: false, error: m };\n    if (m.indexOf('BUSY: ') === 0) { out.busy = true; out.error = m.slice(6); }\n    if (m.indexOf('CONFLICT: ') === 0) { out.conflict = true; out.error = m.slice(10); }\n    return out;\n  }\n}\nfunction json_(obj) { return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON); }\n\nvar ADMIN = { ping: 1, getDraft: 1, saveDraft: 1, publish: 1, versions: 1, getVersion: 1, setStatus: 1, participants: 1, responses: 1,\n  deleteParticipant: 1, deletePilots: 1, contacts: 1, clearContacts: 1, log: 1 };\n\nfunction route_(r) {\n  if (ADMIN[r.action] && (!ADMIN_KEY || ADMIN_KEY.indexOf('__') === 0 || r.key !== ADMIN_KEY)) throw new Error('The admin key does not match this backend.');\n  switch (r.action) {\n    case 'ping':\n      var ss = SpreadsheetApp.getActiveSpreadsheet();\n      Object.keys(HEADERS).forEach(function (n) { sheet_(n); });\n      return { sheet: ss.getName(), url: ss.getUrl(), status: status_(), published: latestVersion_(), backend: 2 };\n    case 'getDraft': return getDraft_();\n    case 'saveDraft': return locked_(function () { return saveDraft_(r.content, r.base, r.force); });\n    case 'publish': return locked_(function () { return publish_(r.content, r.note); });\n    case 'versions': return { versions: versions_() };\n    case 'getVersion': var c = getVersion_(Number(r.v)); if (!c) throw new Error('No such version.'); return { content: c };\n    case 'setStatus':\n      if (r.status !== 'open' && r.status !== 'closed') throw new Error('Status must be open or closed.');\n      setProp_('STATUS', r.status); log_('status', r.status);\n      return { status: r.status };\n    case 'participants': return { participants: participants_(false) };\n    case 'responses': return { participants: participants_(true), versions: versions_() };\n    case 'deleteParticipant': return locked_(function () { var n = deleteParticipant_(String(r.pid || '')); log_('delete participant', r.pid); return { deleted: n }; });\n    case 'deletePilots': return locked_(function () { var n = deletePilots_(); log_('delete pilot and baseline participants', n); return { deleted: n }; });\n    case 'contacts': return { contacts: table_('Contacts').data.map(function (x) { return { pid: String(x[0]), email: String(x[1] || ''), added: iso_(x[2]) }; }) };\n    case 'clearContacts': return locked_(function () { var n = clearContacts_(); log_('delete email addresses', n); return { cleared: n }; });\n    case 'log': return { log: table_('Log').data.map(function (x) { return { time: iso_(x[0]), action: String(x[1]), detail: String(x[2] || '') }; }) };\n    case 'content': return content_(r);\n    case 'join': return locked_(function () { return join_(r); });\n    case 'allocate': return locked_(function () { return allocate_(r); });\n    case 'resume': return resume_(r);\n    case 'save': return locked_(function () { return save_(r); });\n    case 'submit': return locked_(function () { return submit_(r); });\n    case 'withdraw': return locked_(function () { return withdraw_(r); });\n    case 'contact': return locked_(function () { return contact_(r); });\n  }\n  throw new Error('Unknown action: ' + r.action);\n}\n\n/* ---------- helpers ---------- */\nfunction locked_(fn) {\n  var lock = LockService.getScriptLock();\n  if (!lock.tryLock(30000)) throw new Error('BUSY: The study server is busy. Please try again in a moment.');\n  try { return fn(); }\n  finally { SpreadsheetApp.flush(); lock.releaseLock(); }\n}\nfunction sheet_(name) {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  if (!ss) throw new Error('This script is not attached to a Google Sheet. Open your Sheet, choose Extensions > Apps Script, and paste the script there.');\n  var sh = ss.getSheetByName(name);\n  if (!sh) {\n    sh = ss.insertSheet(name);\n    var h = HEADERS[name];\n    if (h) { ensure_(sh, 1, h.length); sh.getRange(1, 1, 1, h.length).setValues([h]).setFontWeight('bold'); sh.setFrozenRows(1); }\n  }\n  return sh;\n}\nfunction ensure_(sh, row, col) {   // a new tab is 1,000 rows by 26 columns; writing outside it fails\n  var mr = sh.getMaxRows(), mc = sh.getMaxColumns();\n  if (row > mr) sh.insertRowsAfter(mr, row - mr + 200);\n  if (col > mc) sh.insertColumnsAfter(mc, col - mc + 10);\n}\nfunction table_(name) {\n  var sh = sheet_(name), last = sh.getLastRow(), cols = sh.getLastColumn();\n  return { sh: sh, data: last > 1 && cols > 0 ? sh.getRange(2, 1, last - 1, cols).getValues() : [] };\n}\nfunction head_(name, width) {   // the first `width` columns of every data row, without the JSON parts\n  var sh = sheet_(name), last = sh.getLastRow();\n  ensure_(sh, 1, width);\n  return { sh: sh, data: last > 1 ? sh.getRange(2, 1, last - 1, width).getValues() : [] };\n}\nfunction rowAt_(sh, i) { return sh.getRange(i + 2, 1, 1, Math.max(1, sh.getLastColumn())).getValues()[0]; }\nfunction find_(data, test) { for (var i = 0; i < data.length; i++) if (test(data[i])) return i; return -1; }\nfunction pack_(obj) {\n  var s = JSON.stringify(obj), parts = [];\n  for (var i = 0; i < s.length; i += CHUNK) parts.push('~' + s.substr(i, CHUNK));   // '~' keeps Sheets from reading a chunk as a number or formula\n  return parts;\n}\nfunction unpack_(row, at) {\n  var n = Number(row[at]) || 0, s = '';\n  for (var i = 1; i <= n; i++) s += String(row[at + i] || '').substr(1);\n  if (!s) return null;\n  try { return JSON.parse(s); } catch (err) { return null; }\n}\nfunction writeRow_(sh, rowIndex, fixed, parts) {\n  var vals = fixed.concat([parts.length]).concat(parts);\n  var width = Math.max(sh.getLastColumn(), vals.length);\n  while (vals.length < width) vals.push('');\n  ensure_(sh, rowIndex, vals.length);\n  sh.getRange(rowIndex, 1, 1, vals.length).setValues([vals]);\n}\nfunction iso_(v) { return v instanceof Date ? v.toISOString() : (v || ''); }\nfunction cell_(v) {   // text stays text: no formulas, and no \"1-2\" turning into a date\n  if (v === null || v === undefined) return '';\n  if (typeof v === 'number' || typeof v === 'boolean') return v;\n  if (Object.prototype.toString.call(v) === '[object Array]') v = v.join('; ');\n  if (typeof v === 'object') v = JSON.stringify(v);\n  var s = String(v);\n  if (s.length > 45000) s = s.slice(0, 45000) + '...';\n  return s === '' ? '' : \"'\" + s;\n}\nfunction status_() { return prop_('STATUS') || 'open'; }\nfunction prop_(k) { return PropertiesService.getScriptProperties().getProperty(k); }\nfunction setProp_(k, v) { PropertiesService.getScriptProperties().setProperty(k, v); }\nfunction rand_(n) { var s = ''; while (s.length < n) s += Utilities.getUuid().replace(/-/g, ''); return s.slice(0, n); }\nfunction log_(action, detail) { try { sheet_('Log').appendRow([new Date(), action, cell_(detail === undefined ? '' : String(detail))]); } catch (err) { } }\n\n/* ---------- content: a draft (version 0) and published versions 1, 2, 3 ... ---------- */\nfunction latestVersion_() {\n  var t = head_('Content', 2), v = 0;\n  t.data.forEach(function (r) { if (r[1] === 'published' && Number(r[0]) > v) v = Number(r[0]); });\n  return v;\n}\nfunction getVersion_(v) {\n  var t = head_('Content', 2);\n  var i = find_(t.data, function (r) { return Number(r[0]) === v && (v === 0 || r[1] === 'published'); });\n  return i < 0 ? null : unpack_(rowAt_(t.sh, i), 4);\n}\nfunction check_(c) {\n  if (!c || typeof c !== 'object' || c.kind !== 'perception' || !c.methods || !c.groups || !c.parts) throw new Error('This is not content for the IS perception study.');\n  var s = JSON.stringify(c);\n  if (s.length > 3000000) throw new Error('The study content is too large (over 3 MB). Use links for images instead of pasting them.');\n}\nfunction getDraft_() {\n  var t = head_('Content', 3), latest = latestVersion_();\n  var i = find_(t.data, function (r) { return Number(r[0]) === 0; });\n  if (i >= 0) return { draft: unpack_(rowAt_(t.sh, i), 4), saved: iso_(t.data[i][2]), published: latest };\n  return { draft: latest ? getVersion_(latest) : null, saved: '', published: latest };\n}\nfunction saveDraft_(c, base, force) {\n  check_(c);\n  var t = head_('Content', 3), now = new Date();\n  var i = find_(t.data, function (r) { return Number(r[0]) === 0; });\n  var cur = i >= 0 ? iso_(t.data[i][2]) : '';\n  if (!force && base && cur && cur !== base) throw new Error('CONFLICT: The draft was saved from another tab or browser at ' + cur + '.');\n  writeRow_(t.sh, i >= 0 ? i + 2 : t.sh.getLastRow() + 1, [0, 'draft', now, ''], pack_(c));\n  return { saved: now.toISOString() };\n}\nfunction publish_(c, note) {\n  if (!c) c = getDraft_().draft;\n  check_(c);\n  var v = latestVersion_() + 1, now = new Date();\n  c.version = v; c.publishedAt = now.toISOString();\n  var sh = sheet_('Content');\n  writeRow_(sh, sh.getLastRow() + 1, [v, 'published', now, cell_(note || '')], pack_(c));\n  try { setProp_('META_' + v, JSON.stringify(metaOf_(c))); } catch (err) { }   // a property holds 9 KB; without it the summary is rebuilt when needed\n  log_('publish', 'version ' + v + (note ? ': ' + note : ''));\n  var r = saveDraft_(c, null, true);\n  return { version: v, saved: r.saved };\n}\nfunction versions_() {\n  return head_('Content', 4).data.filter(function (r) { return r[1] === 'published'; })\n    .map(function (r) { return { version: Number(r[0]), saved: iso_(r[2]), note: String(r[3] || '') }; })\n    .sort(function (a, b) { return b.version - a.version; });\n}\n/* The knowledge questions can be switched off for the whole study; they then stay stored but are never sent or scored. */\nfunction knowledgeOn_(c) { return !(c && c.settings && c.settings.knowledge === false); }\n/* What participants receive: no answer keys, sources, notes, quality rules or allocation weights. */\nfunction publicView_(c) {\n  var p = JSON.parse(JSON.stringify(c)), on = knowledgeOn_(c);\n  delete p.quality; delete p.note;\n  p.allocation = { perPerson: (c.allocation || {}).perPerson || 3 };\n  (p.groups || []).forEach(function (g) { delete g.target; });\n  (p.methods || []).forEach(function (m) {\n    delete m.notes;\n    m.knowledge = on ? (m.knowledge || []).map(function (q) { return { id: q.id, label: q.label, stem: q.stem, options: q.options }; }) : [];\n  });\n  return p;\n}\nfunction content_(r) {\n  var latest = latestVersion_();\n  if (!latest) return { status: 'empty' };\n  var v = Number(r.v) || latest;\n  var c = getVersion_(v);\n  if (!c) throw new Error('This version of the study does not exist.');\n  return { status: status_(), version: v, latest: latest, content: publicView_(c) };\n}\n/* a small summary of a version, kept in the script properties, so allocation stays fast */\nfunction metaOf_(c) {\n  var a = c.allocation || {};\n  return {\n    phases: (c.phases || []).map(function (p) { return p.id; }),\n    methods: (c.methods || []).filter(function (m) { return m.on !== false; }).map(function (m) { return { id: m.id, phase: m.phase }; }),\n    groups: (c.groups || []).map(function (g) { return { id: g.id, target: Number(g.target) || 0 }; }),\n    k: Number(a.perPerson) || 3, order: a.order || 'balanced', hold: Number(a.holdMinutes) || 120, rnd: Number(a.randomness) || 0,\n    sets: a.sets || [], w: a.weights || {}, closeWhenFull: !!((c.settings || {}).closeWhenFull),\n    kOn: knowledgeOn_(c),\n    keys: (c.methods || []).reduce(function (o, m) { if (knowledgeOn_(c)) (m.knowledge || []).forEach(function (q) { o[m.id + '.' + q.id] = q.key; }); return o; }, {})\n  };\n}\nfunction meta_(v) {\n  var m = null;\n  try { m = JSON.parse(prop_('META_' + v) || 'null'); } catch (err) { m = null; }\n  if (m) return m;\ async function connect(url, key) {

  E.conn = { url, key };
  try {
    const p = await api('ping');
    E.sheet = p.sheet; E.sheetUrl = p.url; E.status = p.status; E.published = p.published; E.backend = p.backend || 1;
    const d = await api('getDraft');
    if (d.draft && E.draft && JSON.stringify(d.draft) !== JSON.stringify(E.draft)) {

      if (useServer) { E.draft = migrate(d.draft); E.saved = d.saved; E.dirty = false; }
      else { E.saved = d.saved; await pushDraft(true); }
    } else if (d.draft) { E.draft = migrate(d.draft); E.saved = d.saved; E.dirty = false; }
    else if (E.draft) { E.saved = ''; await pushDraft(true); }
    saveLocal();
  } catch (e) { E.conn = old; throw e; }
}

  else { d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 1); }

    const v = ei.id + '_' + e.id, vals = people.map(p => (p.state.answers || {})[v]).filter(x => typeof x === 'number');
    const N = vals.length, ne = vals.filter(x => x === hi).length, crit = ISP.cvrCritical(N);
    return { e, N, ne, cvr: N ? ISP.cvr(ne, N) : null, crit: crit && crit.cvr !== null ? crit.cvr : null,
      per: c.groups.map(g => { const w = people.filter(p => p.group === g.id).map(p => (p.state.answers || {})[v]).filter(x => typeof x === 'number'); return w.length ? ISP.cvr(w.filter(x => x === hi).length, w.length) : null; }) };
  });
  const N = Math.max(0, ...rows.map(r => r.N)), top = rows.find(r => r.N === N), crit = top ? top.crit : null;
  let minN = 0; for (let k = 1; k <= 40 && !minN; k++) { const cc = ISP.cvrCritical(k); if (cc && cc.cvr !== null) minN = k; }
  const L = 200, R = 176, T = crit !== null ? 30 : 12, rh = 25, B = 30, H = T + rows.length * rh + B, yb = T + rows.length * rh;
  const draw = W => {
    const pw = W - L - R, X = v => L + (v + 1) / 2 * pw;
    const svg = sv('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, class: 'dsvg', role: 'img', 'aria-label': 'Content validity ratio per information element' });
    [-1, -0.5, 0, 0.5, 1].forEach(v => svg.append(sv('line', { x1: X(v), x2: X(v), y1: T - 6, y2: yb, class: v === 0 ? 'base' : 'grid' }),
      sv('text', { x: X(v), y: yb + 18, class: 'ax', 'text-anchor': 'middle' }, v === 0 ? '0' : (v < 0 ? '−' : '') + Math.abs(v).toFixed(1))));
    if (crit !== null) svg.append(sv('line', { x1: X(crit), x2: X(crit), y1: T - 8, y2: yb, class: 'crit' }), sv('text', { x: X(crit), y: T - 14, class: 'ax', 'text-anchor': 'middle' }, 'critical value ' + fix(crit, 2)));
    rows.forEach((r, i) => {
      const cy = T + i * rh + rh / 2, meets = r.N && r.crit !== null ? r.cvr >= r.crit - 1e-9 : null;
      svg.append(sv('text', { x: L - 16, y: cy + 4, class: 'lb', 'text-anchor': 'end' }, r.e.label));
      if (r.cvr !== null) {
        const x0 = X(0), w = Math.abs(X(r.cvr) - x0), pos = r.cvr > 0, neg = r.cvr < 0, col = pos ? DBLUE : neg ? DNEG : '#8d9aa5', hh = 14, rad = Math.min(4, w / 2);
        let d;
        if (!pos && !neg) d = 'M' + (x0 - 1) + ',' + (cy - hh / 2) + ' h2 v' + hh + ' h-2 Z';
        else { const s = pos ? 1 : -1, xe = x0 + s * w; d = 'M' + x0 + ',' + (cy - hh / 2) + ' H' + (xe - s * rad) + ' Q' + xe + ',' + (cy - hh / 2) + ' ' + xe + ',' + (cy - hh / 2 + rad) + ' V' + (cy + hh / 2 - rad) + ' Q' + xe + ',' + (cy + hh / 2) + ' ' + (xe - s * rad) + ',' + (cy + hh / 2) + ' H' + x0 + ' Z'; }
        svg.append(tipOn(sv('g', { class: 'mk' }, sv('rect', { x: L, y: cy - rh / 2, width: pw, height: rh, fill: 'transparent' }), sv('path', { d, fill: col })),
          () => [r.e.label, [{ value: fix(r.cvr, 2), label: 'content validity ratio', color: col }, { value: r.ne + ' of ' + r.N, label: 'rated it essential' }]
            .concat(c.groups.map((g, j) => ({ value: r.per[j] === null ? '–' : fix(r.per[j], 2), label: g.label, color: groupCol(g.id) })),
              r.crit !== null ? [{ value: meets ? '✓ meets' : 'below', label: 'the critical value ' + fix(r.crit, 2) }] : [])]));
      }
      svg.append(sv('text', { x: W - R + 18, y: cy + 4, class: 'num' }, r.N ? pct(r.ne / r.N) + ' (' + r.ne + ' of ' + r.N + ')' : '–'));
      if (meets) svg.append(sv('text', { x: W - 8, y: cy + 4, class: 'ok', 'text-anchor': 'end' }, '✓'));
    });
    return svg;
  };
  const legend = h('div', { class: 'dlegend' }, h('span', {}, h('span', { class: 'sw', style: { background: DBLUE } }), 'more than half rated it essential'),
    h('span', {}, h('span', { class: 'sw', style: { background: DNEG } }), 'fewer than half'),
    h('span', {}, 'right: share rating it essential'),
    crit !== null ? h('span', {}, h('span', { class: 'critkey' }), 'critical value for ' + N + ' raters; ', h('b', { style: { color: '#006300' } }, '✓'), ' meets it')
      : h('span', { class: 'muted' }, 'A critical value needs at least ' + (minN || 5) + ' raters; there ' + (N === 1 ? 'is 1' : 'are ' + N) + ' so far.'));
  return panel('Necessity of each information element (Part E)', 'Content validity ratio (Lawshe): (essential − N/2) / (N/2), from −1 (nobody rated the element essential) to 1 (everyone did), with the exact critical value for this number of raters (one-tailed, p = .05).',
    h('div', {}, legend, fitChart(draw, H, 640)),
    numTable(['Element', 'N', 'Essential', 'CVR'].concat(c.groups.map(g => g.id + ' CVR'), ['Critical', 'Meets']),
      rows.map(r => [r.e.label, r.N, r.ne, r.cvr === null ? '–' : fix(r.cvr, 2)].concat(r.per.map(v => v === null ? '–' : fix(v, 2)), [r.crit === null ? '–' : fix(r.crit, 2), r.N && r.crit !== null ? (r.cvr >= r.crit - 1e-9 ? 'yes' : 'no') : '–']))), null, 'cvr');
}
// who took part: choices as bars, numbers as dots on a line
function dashWho(c, people) {
  const items = [];
  (c.parts || []).filter(pt => pt.where !== 'after').forEach(pt => (pt.items || []).forEach(it => { if ((it.type === 'single' && it.options && it.options.length) || it.type === 'number') items.push(it); }));
  const blocks = items.map(it => {
    const ans = people.map(p => (p.state.answers || {})[it.id]), title = h('h3', {}, ISP.mdText(it.text));
    if (it.type === 'number') {
      const v = ans.filter(x => typeof x === 'number');
      if (!v.length) return h('div', { class: 'wbox' }, title, h('p', { class: 'muted small' }, 'No answers yet.'));
      const mx = Math.max(1, ...v), md = ISP.median(v), Hh = 64, base = 36;
      const draw = W => {
        const P = 10, X = x => P + x / mx * (W - 2 * P);
        const svg = sv('svg', { width: W, height: Hh, viewBox: '0 0 ' + W + ' ' + Hh, class: 'dsvg', role: 'img', 'aria-label': ISP.mdText(it.text) },
          sv('line', { x1: P, x2: W - P, y1: base, y2: base, class: 'base' }), sv('text', { x: P, y: Hh - 6, class: 'ax' }, '0'),
          sv('text', { x: W - P, y: Hh - 6, class: 'ax', 'text-anchor': 'end' }, mx + (it.unit ? ' ' + it.unit : '')),
          sv('line', { x1: X(md), x2: X(md), y1: 6, y2: base + 8, stroke: '#1c2328', 'stroke-width': 2 }));
        const seen = {};
        v.slice().sort((a, b) => a - b).forEach(x => { const k = Math.round(X(x) / 8); seen[k] = (seen[k] || 0) + 1; svg.append(sv('circle', { cx: X(x), cy: base - 6 - (seen[k] - 1) * 8, r: 4, fill: DBLUE, stroke: '#fff', 'stroke-width': 1.5 })); });
        return svg;
      };
      return h('div', { class: 'wbox' }, title, h('p', { class: 'wsum' }, h('b', {}, fix(md, 1)), ' median' + (it.unit ? ' ' + it.unit : '') + (v.length >= 4 ? ', middle half ' + fix(quant(v, 0.25), 1) + '–' + fix(quant(v, 0.75), 1) : '') + ', n = ' + v.length), fitChart(draw, Hh, 220));
    }
    const n = ans.filter(x => x !== undefined && x !== null && x !== '').length, counts = it.options.map(o => ans.filter(x => x === o.id).length), max = Math.max(1, ...counts);
    return h('div', { class: 'wbox' }, title, h('div', { class: 'wbars' }, it.options.map((o, i) => h('div', { class: 'wrow' },
      h('span', { class: 'wl' }, o.text), h('span', { class: 'wb' }, counts[i] ? h('span', { style: { width: (counts[i] / max * 100) + '%', background: it.role === 'group' && o.group ? groupCol(o.group) : DBLUE } }) : null),
      h('span', { class: 'wv' }, counts[i] + (n ? ' (' + pct(counts[i] / n) + ')' : ''))))));
  });
  return panel('Who took part', 'Answers to the questions before the reading, from the finished participants above. The black line marks the median.', h('div', { class: 'wgrid' }, blocks), null, null, 'who');
}

/* =====================================================================================
   Part 9: start-up. Kept last, so that every view is defined before the first render.
   ===================================================================================== */
/* ------------------------------------------------------------------ start */
$('#pv-btn').addEventListener('click', () => { if (!E.draft) return toast('Load the study content first.'); openPreview(); });
$('#pub-btn').addEventListener('click', () => { if (!E.draft) return toast('Load the study content first.'); go('publish'); });
async function start() {
  loadLocal();
  if (E.draft) E.draft = migrate(E.draft);
  render();
  if (E.conn) {
    setSave('Connecting…');
    try {
      const p = await api('ping');
      E.sheet = p.sheet; E.sheetUrl = p.url; E.status = p.status; E.published = p.published; E.backend = p.backend || 1;
      const d = await api('getDraft');
      if (d.draft && (!E.draft || (d.saved && d.saved !== E.saved && !E.dirty))) { E.draft = migrate(d.draft); E.saved = d.saved; }
      else if (d.draft && d.saved !== E.saved && E.dirty) {
        const useServer = await ask('Two versions of the draft', 'This browser has changes that were not saved to the Sheet, and the Sheet has a newer draft (' + fmtTime(d.saved) + '). Load the Sheet\'s draft? (Cancel keeps this browser\'s changes and saves them.)', 'Load the Sheet\'s draft');
        if (useServer) { E.draft = migrate(d.draft); E.saved = d.saved; E.dirty = false; } else { E.saved = d.saved; await pushDraft(true); }
      } else if (E.dirty) await pushDraft();
      saveLocal();
      setSave('Connected');
      if (E.published) { try { E.vc[E.published] = (await api('getVersion', { v: E.published })).content; } catch (e) { } }
      render();
      try { await loadData(); if (['overview', 'dashboard', 'data', 'allocation', 'quality'].indexOf(E.section) >= 0) render(); } catch (e) { }
    } catch (e) { setSave('Backend not reachable: ' + e.message, true); }
  } else setSave(E.draft ? 'Not connected: changes stay in this browser' : '');
}
window.__editor = { E, ISP, XLSX, buildWorkbook, prepared, loadData, render, go, migrate, codebook };   // for the automated tests
start();
