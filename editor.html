<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Study editor: IS perception study</title>
<style>
:root{color-scheme:light;--ink:#1c2328;--ink2:#52514e;--muted:#6b737a;--line:#dde2e6;--soft:#eef1f4;--bg:#f4f5f7;--card:#fff;--accent:#24597f;--accent-d:#1b4766;--sel:#e3eef7;
  --good:#0ca30c;--good-t:#006300;--crit:#d03b3b;--warn:#b07800;--warnbg:#fff6dc;--errbg:#fdeceb;--okbg:#e9f6e9;--s1:#2a78d6;--track:#cde2fb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--accent)}
header.bar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.logo{font-weight:700;font-size:15px;white-space:nowrap}
.logo span{color:var(--muted);font-weight:500}
.stitle{color:var(--muted);flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savest{font-size:12.5px;color:var(--muted);white-space:nowrap}
.savest.err{color:var(--crit)}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 50px)}
nav.side{background:#fff;border-right:1px solid var(--line);padding:12px 8px;position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto}
nav.side button{display:flex;width:100%;text-align:left;border:none;background:none;padding:8px 12px;border-radius:7px;font:inherit;color:var(--ink);cursor:pointer;gap:8px;align-items:center}
nav.side button:hover{background:var(--soft)}
nav.side button.on{background:var(--sel);color:var(--accent-d);font-weight:600}
nav.side .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
nav.side .sep{height:1px;background:var(--line);margin:8px 6px}
main#main{padding:20px 24px 60px;max-width:1240px;width:100%}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:16px 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 14px}
.card.tight{padding:10px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:980px){.layout{grid-template-columns:1fr}nav.side{position:static;height:auto;display:flex;flex-wrap:wrap}nav.side button{width:auto}.grid2,.grid3{grid-template-columns:1fr}}
label.f{display:block;margin:0 0 12px}
label.f>span.l{display:block;font-weight:600;font-size:13px;margin:0 0 4px}
label.f>span.hint,.hint{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
input[type=text],input[type=number],input[type=url],input[type=password],input[type=email],select,textarea{font:inherit;border:1px solid #bcc6ce;border-radius:6px;padding:7px 9px;width:100%;background:#fff;color:var(--ink)}
input[type=number]{width:110px}
textarea{resize:vertical;min-height:60px;line-height:1.45}
textarea.md{font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid #9fc4e3;border-color:var(--accent)}
.bad{border-color:var(--crit)!important;background:var(--errbg)!important}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline>label{display:flex;gap:6px;align-items:center}
label.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
label.chk input{flex:none;margin:3px 0 0;width:16px;height:16px;accent-color:var(--accent)}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--accent)}
.btn.sec:hover{background:var(--sel)}
.btn.small{padding:3px 9px;font-size:13px;font-weight:500}
.btn.danger{background:#fff;color:var(--crit);border-color:#e3a5a5}
.btn.danger:hover{background:var(--errbg)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.ghost:hover{background:var(--soft)}
.icons{display:inline-flex;gap:2px}
.icons button{border:1px solid transparent;background:none;border-radius:5px;padding:2px 6px;cursor:pointer;color:var(--muted);font-size:13px}
.icons button:hover{background:var(--soft);color:var(--ink);border-color:var(--line)}
.icons button.del:hover{color:var(--crit)}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--soft);padding:6px 8px;text-align:left;vertical-align:top}
table.tbl th{font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td.n,table.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
table.tbl tr:hover td{background:#fafbfc}
.scroll{overflow-x:auto}
.badge{display:inline-flex;gap:4px;align-items:center;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--good-t)}
.badge.err{background:var(--errbg);color:var(--crit)}
.badge.warn{background:var(--warnbg);color:#7a5400}
.badge.blue{background:var(--sel);color:var(--accent-d)}
.msg{border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13.5px}
.msg.err{background:var(--errbg);color:#8c1d18}
.msg.warn{background:var(--warnbg);color:#5e4300}
.msg.ok{background:var(--okbg);color:var(--good-t)}
.msg.info{background:var(--sel);color:var(--accent-d)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .tl{font-size:12.5px;color:var(--muted)}
.tile .tv{font-size:28px;font-weight:600;line-height:1.2;margin:2px 0}
.tile .td{font-size:12.5px;color:var(--ink2)}
.meter{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:6px}
.meter>div{height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.barcell{display:flex;align-items:center;gap:6px;min-width:120px}
.barcell .b{height:10px;background:var(--s1);border-radius:0 4px 4px 0;min-width:1px}
.barcell .v{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.heat td.hc{text-align:center;font-variant-numeric:tabular-nums;border:2px solid #fff;border-radius:4px}
.itemrow{display:grid;grid-template-columns:70px 132px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:6px 0;background:#fff}
.itemrow .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;font-weight:600}
.itemrow .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.itemrow.open{border-color:var(--accent);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0;background:var(--sel)}
.itemed{border:1px solid var(--accent);border-top:none;border-radius:0 0 8px 8px;padding:12px;margin:0 0 8px;background:#fcfdfe}
.opts-ed .orow{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:6px;align-items:center;margin:4px 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.preview{border:1px solid var(--line);border-radius:8px;padding:12px 16px;background:#fff;max-height:none}
.preview p{margin:0 0 8px}
.mded{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.mded .elrow{margin:0 0 14px}
.mded .elrow .eh{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:13px;margin-bottom:3px}
.mded .pv{position:sticky;top:62px;max-height:calc(100vh - 80px);overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 18px 18px}
@media (max-width:1100px){.mded{grid-template-columns:1fr}.mded .pv{position:static;max-height:none}}
/* method description preview: same look as the participant page */
.read{font-size:15px;line-height:1.6}
.read .mname{font-size:24px;font-weight:700;margin:10px 0 6px;padding-bottom:8px;border-bottom:2px solid var(--soft)}
.read .el>h3{background:#f2f2f2;border-radius:6px;font-size:1.04em;font-weight:700;margin:18px 0 10px;padding:8px 12px}
.read .el p{margin:0 0 9px}
.read .el ul,.read .el ol{margin:0 0 10px;padding-left:24px}
.read .el li{margin:0 0 6px}
.read.nomark .el ul{list-style:none}
.tablewrap{overflow-x:auto;margin:6px 0 12px}
table.mdt{border-collapse:collapse;font-size:.93em}
table.mdt td,table.mdt th{border:1px solid #444;padding:5px 9px;vertical-align:top;text-align:left}
table.mdt th{background:#f2f2f2}
.kq{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 12px;background:#fff}
.modal{position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal[hidden]{display:none}
.modal .box{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .box.wide{max-width:1100px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1c2328;color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #c9d6e0;border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
pre.code{background:#f6f7f8;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;white-space:pre-wrap;max-height:300px;overflow:auto}
.steps li{margin:0 0 8px}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border-radius:4px;padding:0 4px;font-size:12.5px}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
details>summary{cursor:pointer;font-weight:600}
.muted{color:var(--muted)}
.right{text-align:right}
.mt{margin-top:12px}
</style>
<script src="common.js"></script>
</head>
<body>
<header class="bar">
  <div class="logo">Study editor <span>· IS perception study</span></div>
  <div class="stitle" id="stitle"></div>
  <div class="savest" id="savest"></div>
  <button class="btn sec small" id="pv-btn" type="button">Preview</button>
  <button class="btn small" id="pub-btn" type="button">Publish</button>
</header>
<div class="layout">
  <nav class="side" id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================================
   IS perception study: the researcher's editor. Part 1: core (state, backend, layout,
   form helpers), Connect & set up, Overview.
   ===================================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v; else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  });
  kids.flat(Infinity).forEach(k => { if (k !== null && k !== undefined && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k))); });
  return e;
};
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
const LS = 'isp-editor1';
const E = { conn: null, draft: null, saved: '', published: 0, status: '', sheet: null, sheetUrl: '', dirty: false, section: 'overview', methodId: null,
  open: new Set(), data: null, vc: {}, versions: [], pendingKey: '' };
const fmtTime = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? String(iso) : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }); };
const pct = (x, d = 0) => x === null || x === undefined || !isFinite(x) ? '–' : (x * 100).toFixed(d) + '%';
const fix = (x, d = 2) => x === null || x === undefined || !isFinite(x) ? '–' : Number(x).toFixed(d);
const C = () => E.draft;

function toast(msg, ms = 2800) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), ms); }
function modal(kids, opts = {}) {
  const m = $('#modal'); m.innerHTML = '';
  const box = h('div', { class: 'box' + (opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true' }, kids);
  m.append(box); m.hidden = false;
  m.onclick = e => { if (e.target === m && !opts.sticky) closeModal(); };
  const f = box.querySelector('input, textarea, select, button'); if (f) f.focus();
  return box;
}
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
function ask(title, text, ok = 'OK', danger = false) {
  return new Promise(res => {
    modal([h('h2', {}, title), typeof text === 'string' ? h('p', {}, text) : text,
      h('div', { class: 'inline mt', style: { justifyContent: 'flex-end' } },
        h('button', { class: 'btn sec', type: 'button', onclick: () => { closeModal(); res(false); } }, 'Cancel'),
        h('button', { class: 'btn' + (danger ? ' danger' : ''), type: 'button', onclick: () => { closeModal(); res(true); } }, ok))]);
  });
}
function download(name, blobOrText, type = 'application/json') {
  const blob = blobOrText instanceof Blob ? blobOrText : new Blob([blobOrText], { type });
  const a = h('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const stamp = () => new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '').replace(/^(\d{8})(\d{4})$/, '$1_$2');

/* ------------------------------------------------------------------ keeping the draft */
function loadLocal() {
  const s = ls.get(LS) || {};
  E.conn = s.conn || null; E.draft = s.draft || null; E.saved = s.saved || ''; E.section = s.section || 'overview'; E.methodId = s.methodId || null;
  E.dirty = !!s.dirty; E.pendingKey = s.pendingKey || '';
}
function saveLocal() {
  const ok = ls.set(LS, { conn: E.conn, draft: E.draft, saved: E.saved, section: E.section, methodId: E.methodId, dirty: E.dirty, pendingKey: E.pendingKey });
  if (!ok) setSave('This browser could not keep a copy (storage full)', true);
}
async function api(action, data, tries = 2) {
  if (!E.conn || !E.conn.url) throw new Error('Not connected to a backend yet (see Connect & set up).');
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      const res = await fetch(E.conn.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, key: E.conn.key }, data || {})) });
      const j = await res.json();
      if (j.ok) return j;
      const err = new Error(j.error || 'The backend said no.');
      err.conflict = j.conflict; err.server = !j.busy;
      if (!j.busy) throw err;
      last = err;
    } catch (e) { if (e.server) throw e; last = e; }
    await new Promise(r => setTimeout(r, 800 * (i + 1)));
  }
  throw last;
}
let pushTimer = null;
function touch(rerender) {
  E.dirty = true;
  saveLocal();
  setSave(E.conn ? 'Saving…' : 'Changes kept in this browser');
  clearTimeout(pushTimer);
  if (E.conn) pushTimer = setTimeout(() => pushDraft(), 1400);
  $('#stitle').textContent = (E.draft && E.draft.title) || '';
  if (rerender) render();
}
async function pushDraft(force) {
  if (!E.conn || !E.draft) return;
  try {
    const r = await api('saveDraft', { content: E.draft, base: E.saved, force: !!force });
    E.saved = r.saved; E.dirty = false; saveLocal();
    setSave('Saved to your Sheet ' + new Date().toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }));
  } catch (e) {
    if (e.conflict) {
      setSave('Not saved: changed elsewhere', true);
      modal([h('h2', {}, 'The draft was changed somewhere else'), h('p', {}, e.message + ' Which version do you want to keep?'),
        h('div', { class: 'inline mt' },
          h('button', { class: 'btn sec', type: 'button', onclick: async () => { closeModal(); const d = await api('getDraft'); E.draft = d.draft; E.saved = d.saved; E.dirty = false; saveLocal(); render(); toast('Loaded the other version.'); } }, 'Load the other version'),
          h('button', { class: 'btn', type: 'button', onclick: () => { closeModal(); pushDraft(true); } }, 'Keep mine (overwrite)'))], { sticky: true });
    } else setSave('Not saved: ' + e.message, true);
  }
}
function setSave(text, err) { const s = $('#savest'); s.textContent = text; s.classList.toggle('err', !!err); }
window.addEventListener('beforeunload', e => { if (E.dirty && E.conn) { pushDraft(); e.preventDefault(); e.returnValue = ''; } });

/* ------------------------------------------------------------------ layout */
const NAV = [['overview', 'Overview'], ['texts', 'Study texts'], ['methods', 'Method descriptions'], ['structure', 'Elements, phases, groups'], ['questions', 'Questionnaire'],
  ['allocation', 'Allocation'], ['quality', 'Screening rules'], null, ['publish', 'Publish & versions'], ['data', 'Data & Excel export'], ['connect', 'Connect & set up']];
const VIEWS = {};
function renderNav() {
  const nav = $('#nav'); nav.innerHTML = '';
  NAV.forEach(n => {
    if (!n) { nav.append(h('div', { class: 'sep' })); return; }
    const [id, label] = n;
    let cnt = '';
    if (E.draft && id === 'methods') cnt = ISP.activeMethods(E.draft).length + '/' + (E.draft.methods || []).length;
    if (E.draft && id === 'questions') cnt = String(ISP.allItems(E.draft).filter(x => x.item.type !== 'note').length);
    const on = E.section === id || (id === 'methods' && E.section === 'method');
    nav.append(h('button', { type: 'button', class: on ? 'on' : '', onclick: () => go(id) }, label, cnt ? h('span', { class: 'cnt' }, cnt) : null));
  });
}
function go(section, arg) {
  if (arg !== undefined) E.methodId = arg;
  E.section = section; saveLocal(); render(); window.scrollTo(0, 0);
}
function render() {
  renderNav();
  $('#stitle').textContent = (E.draft && E.draft.title) || '';
  const main = $('#main'), y = window.scrollY, same = render.last === E.section + ':' + E.methodId;
  main.innerHTML = '';
  if (!E.draft && E.section !== 'connect') main.append(noContent());
  else main.append((VIEWS[E.section] || VIEWS.overview)());
  render.last = E.section + ':' + E.methodId;
  if (same) window.scrollTo(0, y);
}
function noContent() {
  return h('div', {}, h('h1', {}, 'No study content yet'),
    h('p', { class: 'sub' }, 'Load the starting content (the file IS_perception_content.json from the kit), or connect to a backend that already has it.'),
    h('div', { class: 'card' }, h('div', { class: 'inline' },
      h('button', { class: 'btn', type: 'button', onclick: () => openFile() }, 'Open a content file…'),
      h('button', { class: 'btn sec', type: 'button', onclick: () => go('connect') }, 'Connect & set up'))));
}
function openFile() {
  const inp = h('input', { type: 'file', accept: '.json,application/json' });
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const c = JSON.parse(await f.text());
      if (!c || c.kind !== 'perception' || !c.methods || !c.parts) throw new Error('This file is not content for the IS perception study.');
      if (E.draft && !(await ask('Replace the draft?', 'The draft you are editing will be replaced by the file "' + f.name + '".', 'Replace'))) return;
      E.draft = migrate(c); touch(); go('overview'); toast('Loaded ' + f.name);
    } catch (e) { toast('Could not open the file: ' + e.message, 5000); }
  };
  inp.click();
}
// fills in anything an older content file lacks, so the editor and pages can rely on it
function migrate(c) {
  c.texts = c.texts || {}; c.groups = c.groups || []; c.phases = c.phases || []; c.elements = c.elements || []; c.methods = c.methods || []; c.parts = c.parts || [];
  c.perMethod = c.perMethod || { title: '{method}: a few questions', items: [] }; c.perMethod.items = c.perMethod.items || [];
  c.scales = c.scales || {}; c.constructs = c.constructs || []; c.researcher = c.researcher || {};
  c.allocation = Object.assign({ perPerson: 3, order: 'balanced', holdMinutes: 120, randomness: 0, sets: [], weights: { method: 4, position: 2, pair: 1, phase: 0, overall: 1 } }, c.allocation || {});
  c.settings = Object.assign({ minutes: 25, baselineMinutes: 10, openBook: 'side', listMarkers: 'none', minReadSeconds: 0, shuffleOptions: true, dontKnow: false, allowBack: true, elementNav: false, closeWhenFull: false }, c.settings || {});
  c.quality = Object.assign({ attention: [], infrequency: [], pairs: [], pairGap: 4, pairFlags: 2, excludeAtFlags: 2 }, c.quality || {});
  c.methods.forEach(m => { m.elements = m.elements || {}; m.knowledge = m.knowledge || []; if (m.on === undefined) m.on = true; });
  return c;

const CODE_GS = "/**\n * IS perception study: backend.\n * A Google Apps Script bound to a Google Sheet. It keeps the study content (a draft and every\n * published version), gives each participant three method descriptions from three different\n * design phases by minimisation (balanced per group), saves answers as they go, scores the\n * knowledge questions with keys participants never receive, and keeps email addresses apart.\n *\n * Setup: in your Google Sheet choose Extensions > Apps Script, replace the sample code with this\n * file and SAVE; then Deploy > New deployment > type: Web app, Execute as: Me, Who has access:\n * Anyone. Copy the web app URL and paste it into the editor (editor.html > Connect).\n * After changing this script: Deploy > Manage deployments > pencil > Version: New version > Deploy.\n * Generated by the study editor on __GENERATED__.\n */\nvar ADMIN_KEY = '__ADMIN_KEY__';   // private: lets the editor read and change the study\nvar CHUNK = 40000;                 // characters per cell when storing JSON (a cell holds 50,000)\nvar APP = 'IS perception study';\n\nvar HEADERS = {\n  Content: ['version', 'status', 'saved', 'note', 'json_parts', 'json'],\n  Participants: ['pid', 'token', 'group', 'mode', 'version', 'status', 'step', 'started', 'updated', 'submitted', 'minutes', 'seq', 'methods', 'src', 'json_parts', 'json'],\n  Contacts: ['pid', 'email', 'added'],\n  Log: ['time', 'action', 'detail']\n};\nvar P_PID = 0, P_TOKEN = 1, P_GROUP = 2, P_MODE = 3, P_VER = 4, P_STATUS = 5, P_STEP = 6, P_STARTED = 7, P_UPDATED = 8,\n  P_SUBMITTED = 9, P_MIN = 10, P_SEQ = 11, P_METHODS = 12, P_SRC = 13, P_JSON = 14;\n\nfunction setup() {\n  Object.keys(HEADERS).forEach(function (n) { sheet_(n); });\n  Logger.log('Ready: ' + SpreadsheetApp.getActiveSpreadsheet().getUrl());\n}\n\nfunction doGet(e) {\n  var p = (e && e.parameter) || {};\n  if (p.action === 'content') return json_(safe_(function () { return content_(p); }));\n  return json_({ ok: true, app: APP, backend: 1 });\n}\n\nfunction doPost(e) {\n  var req;\n  try { req = JSON.parse(e.postData.contents); } catch (err) { return json_({ ok: false, error: 'Bad request' }); }\n  return json_(safe_(function () { return route_(req); }));\n}\n\nfunction safe_(fn) {\n  try { var r = fn() || {}; r.ok = true; return r; }\n  catch (err) {\n    var m = String((err && err.message) || err), out = { ok: false, error: m };\n    if (m.indexOf('BUSY: ') === 0) { out.busy = true; out.error = m.slice(6); }\n    if (m.indexOf('CONFLICT: ') === 0) { out.conflict = true; out.error = m.slice(10); }\n    return out;\n  }\n}\nfunction json_(obj) { return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON); }\n\nvar ADMIN = { ping: 1, getDraft: 1, saveDraft: 1, publish: 1, versions: 1, getVersion: 1, setStatus: 1, participants: 1, responses: 1,\n  deleteParticipant: 1, deletePilots: 1, contacts: 1, clearContacts: 1, log: 1 };\n\nfunction route_(r) {\n  if (ADMIN[r.action] && (!ADMIN_KEY || ADMIN_KEY.indexOf('__') === 0 || r.key !== ADMIN_KEY)) throw new Error('The admin key does not match this backend.');\n  switch (r.action) {\n    case 'ping':\n      var ss = SpreadsheetApp.getActiveSpreadsheet();\n      Object.keys(HEADERS).forEach(function (n) { sheet_(n); });\n      return { sheet: ss.getName(), url: ss.getUrl(), status: status_(), published: latestVersion_(), backend: 1 };\n    case 'getDraft': return getDraft_();\n    case 'saveDraft': return locked_(function () { return saveDraft_(r.content, r.base, r.force); });\n    case 'publish': return locked_(function () { return publish_(r.content, r.note); });\n    case 'versions': return { versions: versions_() };\n    case 'getVersion': var c = getVersion_(Number(r.v)); if (!c) throw new Error('No such version.'); return { content: c };\n    case 'setStatus':\n      if (r.status !== 'open' && r.status !== 'closed') throw new Error('Status must be open or closed.');\n      setProp_('STATUS', r.status); log_('status', r.status);\n      return { status: r.status };\n    case 'participants': return { participants: participants_(false) };\n    case 'responses': return { participants: participants_(true), versions: versions_() };\n    case 'deleteParticipant': return locked_(function () { var n = deleteParticipant_(String(r.pid || '')); log_('delete participant', r.pid); return { deleted: n }; });\n    case 'deletePilots': return locked_(function () { var n = deletePilots_(); log_('delete pilot and baseline participants', n); return { deleted: n }; });\n    case 'contacts': return { contacts: table_('Contacts').data.map(function (x) { return { pid: String(x[0]), email: String(x[1] || ''), added: iso_(x[2]) }; }) };\n    case 'clearContacts': return locked_(function () { var n = clearContacts_(); log_('delete email addresses', n); return { cleared: n }; });\n    case 'log': return { log: table_('Log').data.map(function (x) { return { time: iso_(x[0]), action: String(x[1]), detail: String(x[2] || '') }; }) };\n    case 'content': return content_(r);\n    case 'join': return locked_(function () { return join_(r); });\n    case 'allocate': return locked_(function () { return allocate_(r); });\n    case 'resume': return resume_(r);\n    case 'save': return locked_(function () { return save_(r); });\n    case 'submit': return locked_(function () { return submit_(r); });\n    case 'withdraw': return locked_(function () { return withdraw_(r); });\n    case 'contact': return locked_(function () { return contact_(r); });\n  }\n  throw new Error('Unknown action: ' + r.action);\n}\n\n/* ---------- helpers ---------- */\nfunction locked_(fn) {\n  var lock = LockService.getScriptLock();\n  if (!lock.tryLock(30000)) throw new Error('BUSY: The study server is busy. Please try again in a moment.');\n  try { return fn(); }\n  finally { SpreadsheetApp.flush(); lock.releaseLock(); }\n}\nfunction sheet_(name) {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  if (!ss) throw new Error('This script is not attached to a Google Sheet. Open your Sheet, choose Extensions > Apps Script, and paste the script there.');\n  var sh = ss.getSheetByName(name);\n  if (!sh) {\n    sh = ss.insertSheet(name);\n    var h = HEADERS[name];\n    if (h) { ensure_(sh, 1, h.length); sh.getRange(1, 1, 1, h.length).setValues([h]).setFontWeight('bold'); sh.setFrozenRows(1); }\n  }\n  return sh;\n}\nfunction ensure_(sh, row, col) {   // a new tab is 1,000 rows by 26 columns; writing outside it fails\n  var mr = sh.getMaxRows(), mc = sh.getMaxColumns();\n  if (row > mr) sh.insertRowsAfter(mr, row - mr + 200);\n  if (col > mc) sh.insertColumnsAfter(mc, col - mc + 10);\n}\nfunction table_(name) {\n  var sh = sheet_(name), last = sh.getLastRow(), cols = sh.getLastColumn();\n  return { sh: sh, data: last > 1 && cols > 0 ? sh.getRange(2, 1, last - 1, cols).getValues() : [] };\n}\nfunction head_(name, width) {   // the first `width` columns of every data row, without the JSON parts\n  var sh = sheet_(name), last = sh.getLastRow();\n  ensure_(sh, 1, width);\n  return { sh: sh, data: last > 1 ? sh.getRange(2, 1, last - 1, width).getValues() : [] };\n}\nfunction rowAt_(sh, i) { return sh.getRange(i + 2, 1, 1, Math.max(1, sh.getLastColumn())).getValues()[0]; }\nfunction find_(data, test) { for (var i = 0; i < data.length; i++) if (test(data[i])) return i; return -1; }\nfunction pack_(obj) {\n  var s = JSON.stringify(obj), parts = [];\n  for (var i = 0; i < s.length; i += CHUNK) parts.push('~' + s.substr(i, CHUNK));   // '~' keeps Sheets from reading a chunk as a number or formula\n  return parts;\n}\nfunction unpack_(row, at) {\n  var n = Number(row[at]) || 0, s = '';\n  for (var i = 1; i <= n; i++) s += String(row[at + i] || '').substr(1);\n  if (!s) return null;\n  try { return JSON.parse(s); } catch (err) { return null; }\n}\nfunction writeRow_(sh, rowIndex, fixed, parts) {\n  var vals = fixed.concat([parts.length]).concat(parts);\n  var width = Math.max(sh.getLastColumn(), vals.length);\n  while (vals.length < width) vals.push('');\n  ensure_(sh, rowIndex, vals.length);\n  sh.getRange(rowIndex, 1, 1, vals.length).setValues([vals]);\n}\nfunction iso_(v) { return v instanceof Date ? v.toISOString() : (v || ''); }\nfunction cell_(v) {   // text stays text: no formulas, and no \"1-2\" turning into a date\n  if (v === null || v === undefined) return '';\n  if (typeof v === 'number' || typeof v === 'boolean') return v;\n  if (Object.prototype.toString.call(v) === '[object Array]') v = v.join('; ');\n  if (typeof v === 'object') v = JSON.stringify(v);\n  var s = String(v);\n  if (s.length > 45000) s = s.slice(0, 45000) + '...';\n  return s === '' ? '' : \"'\" + s;\n}\nfunction status_() { return prop_('STATUS') || 'open'; }\nfunction prop_(k) { return PropertiesService.getScriptProperties().getProperty(k); }\nfunction setProp_(k, v) { PropertiesService.getScriptProperties().setProperty(k, v); }\nfunction rand_(n) { var s = ''; while (s.length < n) s += Utilities.getUuid().replace(/-/g, ''); return s.slice(0, n); }\nfunction log_(action, detail) { try { sheet_('Log').appendRow([new Date(), action, cell_(detail === undefined ? '' : String(detail))]); } catch (err) { } }\n\n/* ---------- content: a draft (version 0) and published versions 1, 2, 3 ... ---------- */\nfunction latestVersion_() {\n  var t = head_('Content', 2), v = 0;\n  t.data.forEach(function (r) { if (r[1] === 'published' && Number(r[0]) > v) v = Number(r[0]); });\n  return v;\n}\nfunction getVersion_(v) {\n  var t = head_('Content', 2);\n  var i = find_(t.data, function (r) { return Number(r[0]) === v && (v === 0 || r[1] === 'published'); });\n  return i < 0 ? null : unpack_(rowAt_(t.sh, i), 4);\n}\nfunction check_(c) {\n  if (!c || typeof c !== 'object' || c.kind !== 'perception' || !c.methods || !c.groups || !c.parts) throw new Error('This is not content for the IS perception study.');\n  var s = JSON.stringify(c);\n  if (s.length > 3000000) throw new Error('The study content is too large (over 3 MB). Use links for images instead of pasting them.');\n}\nfunction getDraft_() {\n  var t = head_('Content', 3), latest = latestVersion_();\n  var i = find_(t.data, function (r) { return Number(r[0]) === 0; });\n  if (i >= 0) return { draft: unpack_(rowAt_(t.sh, i), 4), saved: iso_(t.data[i][2]), published: latest };\n  return { draft: latest ? getVersion_(latest) : null, saved: '', published: latest };\n}\nfunction saveDraft_(c, base, force) {\n  check_(c);\n  var t = head_('Content', 3), now = new Date();\n  var i = find_(t.data, function (r) { return Number(r[0]) === 0; });\n  var cur = i >= 0 ? iso_(t.data[i][2]) : '';\n  if (!force && base && cur && cur !== base) throw new Error('CONFLICT: The draft was saved from another tab or browser at ' + cur + '.');\n  writeRow_(t.sh, i >= 0 ? i + 2 : t.sh.getLastRow() + 1, [0, 'draft', now, ''], pack_(c));\n  return { saved: now.toISOString() };\n}\nfunction publish_(c, note) {\n  if (!c) c = getDraft_().draft;\n  check_(c);\n  var v = latestVersion_() + 1, now = new Date();\n  c.version = v; c.publishedAt = now.toISOString();\n  var sh = sheet_('Content');\n  writeRow_(sh, sh.getLastRow() + 1, [v, 'published', now, cell_(note || '')], pack_(c));\n  try { setProp_('META_' + v, JSON.stringify(metaOf_(c))); } catch (err) { }   // a property holds 9 KB; without it the summary is rebuilt when needed\n  log_('publish', 'version ' + v + (note ? ': ' + note : ''));\n  var r = saveDraft_(c, null, true);\n  return { version: v, saved: r.saved };\n}\nfunction versions_() {\n  return head_('Content', 4).data.filter(function (r) { return r[1] === 'published'; })\n    .map(function (r) { return { version: Number(r[0]), saved: iso_(r[2]), note: String(r[3] || '') }; })\n    .sort(function (a, b) { return b.version - a.version; });\n}\n/* What participants receive: no answer keys, sources, notes, quality rules or allocation weights. */\nfunction publicView_(c) {\n  var p = JSON.parse(JSON.stringify(c));\n  delete async function connect(url, key) {

  groups.concat(['all']).forEach(g => ms.forEach(m => aRows.push([g, m.id, m.name, ISP.phaseLabel(c, m.phase), bal[g].exposure[m.id] || 0].concat((bal[g].position[m.id] || Array(k).fill(0))))));
  aRows.push([]); aRows.push(['group', 'pair read together', '', '', 'times']);
  groups.forEach(g => Object.entries(bal[g].pairs).sort().forEach(([pk, n]) => aRows.push([g, pk.replace('|', ' + '), '', '', n])));
  sheets.push({ name: 'Allocation', rows: aRows, widths: [8, 24, 24, 12, 9, 11, 11, 11, 11, 11] });
  // Open answers
  const openIts = ISP.allItems(c).map(x => x.item).filter(it => it.type === 'longtext' || it.type === 'text');
  if (openIts.length) {
    const oRows = [['pid', 'group', 'excluded'].concat(openIts.map(it => it.id))];
    done.forEach(p => { const a = p.state.answers || {}; if (openIts.some(it => String(a[it.id] || '').trim())) oRows.push([p.pid, p.group, p.sc.excluded ? 1 : 0].concat(openIts.map(it => a[it.id] || ''))); });
    sheets.push({ name: 'Open answers', rows: oRows, widths: [8, 7, 9].concat(openIts.map(() => 70)), fmt: Object.fromEntries(openIts.map((_, i) => [i + 3, 'wrap'])) });
  }
  // Baseline
  const bRows = [['pid', 'group', 'method', 'name', 'familiarity'].concat(kq.flatMap(q => [q, q + '_ok']))];
  base.forEach(p => (p.state.blocks || []).forEach((b, i) => {
    const m = ISP.methodById(p.c, b.method) || { knowledge: [], name: b.method }, sb = p.sc.blocks[i] || {}, a = p.state.answers || {};
    const row = [p.pid, p.group, b.method, m.name, famItem ? (a[famItem.id + '_' + b.method] ?? '') : ''];
    kq.forEach(q => { const qq = (m.knowledge || []).find(x => x.id === q); const v = (b.answers || {})[q]; row.push(v === undefined ? '' : decode(p.c, { type: 'single', options: qq ? qq.options : [] }, v), sb[q + '_ok'] ?? ''); });
    bRows.push(row);
  }));
  sheets.push({ name: 'Baseline', rows: bRows, widths: [8, 7, 14, 24, 11, 40, 6, 40, 6], fmt: { 5: 'wrap', 7: 'wrap' } });
  // Codebook and versions
  sheets.push({ name: 'Codebook', rows: [['variable', 'page', 'question or meaning', 'kind', 'values', 'reversed', 'construct', 'asked of']].concat(cb.map(x => [x.v, x.page, x.text, x.kind, x.values, x.reverse, x.construct, x.who])), widths: [18, 24, 60, 14, 50, 9, 10, 10], fmt: { 2: 'wrap', 4: 'wrap' } });
  const counts = {}; people.forEach(p => { counts[p.version] = (counts[p.version] || 0) + 1; });
  sheets.push({ name: 'Versions', rows: [['version', 'published', 'note', 'participants in this file']].concat((E.versions || []).map(x => [x.version, fmtTime(x.saved), x.note, counts[x.version] || 0])), widths: [9, 22, 60, 12] });
  return sheets;
}

/* ------------------------------------------------------------------ a small .xlsx writer (no library) */
const XLSX = (() => {
  const T = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; T[n] = c >>> 0; }
  const crc = u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = T[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const enc = new TextEncoder();
  function zip(files) {
    const parts = [], central = []; let off = 0;
    files.forEach(f => {
      const name = enc.encode(f.name), data = f.data, c = crc(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(8, 0, true); lh.setUint32(14, c, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint32(16, c, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
      central.push(new Uint8Array(ch.buffer), name);
      off += 30 + name.length + data.length;
    });
    const size = central.reduce((s, a) => s + a.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, size, true); end.setUint32(16, off, true);
    return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  const x = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const col = n => { let s = ''; n++; while (n) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const STYLE = { head: 1, wrap: 2, pct: 3, dec2: 4, dec1: 5, bold: 6 };
  function sheet(s) {
    const fmt = s.fmt || {};
    const body = s.rows.map((r, i) => '<row r="' + (i + 1) + '">' + (r || []).map((v, j) => {
      if (v === '' || v === null || v === undefined) return '';
      const ref = col(j) + (i + 1);
      const st = i === 0 && !s.noHeader ? STYLE.head : (s.noHeader && j === 0 ? STYLE.bold : STYLE[fmt[j]] || 0);
      const sa = st ? ' s="' + st + '"' : '';
      if (typeof v === 'number' && isFinite(v)) return '<c r="' + ref + '"' + sa + '><v>' + v + '</v></c>';
      if (typeof v === 'boolean') return '<c r="' + ref + '"' + sa + ' t="b"><v>' + (v ? 1 : 0) + '</v></c>';
      let t = String(v); if (t.length > 32000) t = t.slice(0, 32000);
      return '<c r="' + ref + '"' + sa + ' t="inlineStr"><is><t xml:space="preserve">' + x(t) + '</t></is></c>';
    }).join('') + '</row>').join('');
    const cols = s.widths ? '<cols>' + s.widths.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>' : '';
    const pane = s.noHeader ? '' : '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0">' + pane + '</sheetView></sheetViews>'
      + cols + '<sheetData>' + body + '</sheetData>' + (s.rows.length > 1 && !s.noHeader && s.rows[0].length ? '<autoFilter ref="A1:' + col(s.rows[0].length - 1) + s.rows.length + '"/>' : '') + '</worksheet>';
  }
  function build(sheets) {
    const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n', files = [], put = (name, s) => files.push({ name, data: enc.encode(s) });
    const names = []; sheets.forEach(s => { let n = String(s.name).replace(/[\\/?*[\]:]/g, ' ').slice(0, 31); while (names.indexOf(n) >= 0) n = n.slice(0, 28) + '_' + names.length; names.push(n); });
    put('[Content_Types].xml', X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' + sheets.map((_, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') + '</Types>');
    put('_rels/.rels', X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
    put('xl/workbook.xml', X + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' + sheets.map((s, i) => '<sheet name="' + x(names[i]) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') + '</sheets>'
      + (sheets.some(s => s.rows.length > 1 && !s.noHeader) ? '<definedNames>' + sheets.map((s, i) => s.rows.length > 1 && !s.noHeader && s.rows[0].length ? '<definedName name="_xlnm._FilterDatabase" localSheetId="' + i + '" hidden="1">\'' + x(names[i]).replace(/'/g, "''") + '\'!$A$1:$' + col(s.rows[0].length - 1) + '$' + s.rows.length + '</definedName>' : '').join('') + '</definedNames>' : '') + '</workbook>');
    put('xl/_rels/workbook.xml.rels', X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + sheets.map((_, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') + '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
    put('xl/styles.xml', X + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="3"><numFmt numFmtId="164" formatCode="0.0%"/><numFmt numFmtId="165" formatCode="0.00"/><numFmt numFmtId="166" formatCode="0.0"/></numFmts>'
      + '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
      + '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEEF2F5"/><bgColor indexed="64"/></patternFill></fill></fills>'
      + '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
      + '<cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
      + '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf>'
      + '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf>'
      + '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'
      + '<xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>'
      + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>');
    sheets.forEach((s, i) => put('xl/worksheets/sheet' + (i + 1) + '.xml', sheet(s)));
    return zip(files);
  }
  return { build };
})();

/* ------------------------------------------------------------------ start */
$('#pv-btn').addEventListener('click', () => { if (!E.draft) return toast('Load the study content first.'); openPreview(); });
$('#pub-btn').addEventListener('click', () => { if (!E.draft) return toast('Load the study content first.'); go('publish'); });
async function start() {
  loadLocal();
  if (E.draft) E.draft = migrate(E.draft);
  render();
  if (E.conn) {
    setSave('Connecting…');
    try {
      const p = await api('ping');
      E.sheet = p.sheet; E.sheetUrl = p.url; E.status = p.status; E.published = p.published;
      const d = await api('getDraft');
      if (d.draft && (!E.draft || (d.saved && d.saved !== E.saved && !E.dirty))) { E.draft = migrate(d.draft); E.saved = d.saved; }
      else if (d.draft && d.saved !== E.saved && E.dirty) {
        const useServer = await ask('Two versions of the draft', 'This browser has changes that were not saved to the Sheet, and the Sheet has a newer draft (' + fmtTime(d.saved) + '). Load the Sheet\'s draft? (Cancel keeps this browser\'s changes and saves them.)', 'Load the Sheet\'s draft');
        if (useServer) { E.draft = migrate(d.draft); E.saved = d.saved; E.dirty = false; } else { E.saved = d.saved; await pushDraft(true); }
      } else if (E.dirty) await pushDraft();
      saveLocal();
      setSave('Connected');
      if (E.published) { try { E.vc[E.published] = (await api('getVersion', { v: E.published })).content; } catch (e) { } }
      render();
      try { await loadData(); if (['overview', 'data', 'allocation', 'quality'].indexOf(E.section) >= 0) render(); } catch (e) { }
    } catch (e) { setSave('Backend not reachable: ' + e.message, true); }
  } else setSave(E.draft ? 'Not connected: changes stay in this browser' : '');
}
window.__editor = { E, ISP, XLSX, buildWorkbook, prepared, loadData, render, go, migrate, codebook };   // for the automated tests
